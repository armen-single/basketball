<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Баскетбол</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: Arial; }
  canvas { display: block; }
  .screen { position: fixed; inset: 0; background: rgba(0,0,0,0.8); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
  .hidden { display: none !important; }
  button { background: #ff8c00; color: #fff; border: none; border-radius: 10px; padding: 12px 24px; font: bold 18px Arial; margin: 6px; cursor: pointer; }
  button.green { background: #28a745; }
  input { padding: 12px; border-radius: 8px; border: none; font-size: 18px; text-align: center; margin: 10px; }
  #hud, #timer { position: fixed; top: 12px; font: bold 22px Arial; color: #fff; text-shadow: 2px 2px 0 #000; z-index: 5; }
  #hud { left: 12px; }
  #timer { right: 12px; }
  #backBtn { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); z-index: 10; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">Счёт: 0</div>
<div id="timer" class="hidden"></div>
<button id="backBtn" class="hidden" onclick="backToMenu()">В меню</button>

<div id="reg" class="screen">
  <h1>Регистрация</h1>
  <p>Введи имя:</p>
  <input id="nameInp" maxlength="12">
  <button class="green" onclick="doReg()">Играть</button>
</div>

<div id="menu" class="screen hidden">
  <h1>Баскетбол</h1>
  <p>Привет, <b id="hello"></b></p>
  <button class="green" onclick="start('match')">Матч (80 сек)</button>
  <button onclick="start('train')">Тренировка</button>
  <button onclick="showLeaders()">Таблица лидеров</button>
</div>

<div id="over" class="screen hidden">
  <h1>Игра окончена</h1>
  <p>Счёт: <b id="finalScore"></b></p>
  <button class="green" onclick="saveRes()">Сохранить результат</button>
  <button onclick="backToMenu()">В меню</button>
</div>

<div id="leaderboard" class="screen hidden">
  <h1>Лидеры</h1>
  <div id="leaderList"></div>
  <button onclick="backToMenu()">Назад</button>
</div>

<script>
// --- Данные ---
let playerName = localStorage.getItem('bb_name') || '';
let bestScore = parseInt(localStorage.getItem('bb_best')) || 0;
let leaders = JSON.parse(localStorage.getItem('bb_leaders')) || [];
let score = 0, timeLeft = 80, mode = 'menu', interval;
let ball = { x: 100, y: 300, vx: 0, vy: 0, flying: false };
const hoop = { x: 0, y: 0, r: 35 };
let aim = false, aimX = 0, aimY = 0;
let confetti = [];

// --- Канвас ---
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; hoop.x = canvas.width - 90; hoop.y = canvas.height * 0.25; if(!ball.flying) resetBall(); }
window.addEventListener('resize', resize); resize();

function resetBall() { ball.x = canvas.width * 0.15; ball.y = canvas.height * 0.55; ball.vx = 0; ball.vy = 0; ball.flying = false; }

// --- Логика ---
function doReg() {
  const val = document.getElementById('nameInp').value.trim();
  if(val.length < 2) return alert('Минимум 2 символа');
  playerName = val; localStorage.setItem('bb_name', playerName);
  document.getElementById('reg').classList.add('hidden');
  showMenu();
}

function showMenu() {
  mode = 'menu'; clearInterval(interval);
  document.getElementById('menu').classList.remove('hidden');
  document.getElementById('over').classList.add('hidden');
  document.getElementById('leaderboard').classList.add('hidden');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('timer').classList.add('hidden');
  document.getElementById('backBtn').classList.add('hidden');
  document.getElementById('hello').textContent = playerName;
  resetBall();
}

function start(m) {
  mode = m; score = 0; timeLeft = 80; confetti = [];
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('hud').textContent = 'Счёт: 0';
  
  if(m === 'match') {
    document.getElementById('timer').classList.remove('hidden');
    document.getElementById('timer').textContent = '80';
    document.getElementById('backBtn').classList.add('hidden');
    clearInterval(interval);
    interval = setInterval(() => {
      timeLeft--; document.getElementById('timer').textContent = timeLeft;
      if(timeLeft <= 0) endGame();
    }, 1000);
  } else {
    document.getElementById('timer').classList.add('hidden');
    document.getElementById('backBtn').classList.remove('hidden');
  }
  resetBall();
}

function endGame() {
  mode = 'over'; clearInterval(interval);
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('timer').classList.add('hidden');
  document.getElementById('over').classList.remove('hidden');
  document.getElementById('finalScore').textContent = score;
  if(score > bestScore) { bestScore = score; localStorage.setItem('bb_best', bestScore); }
}

function saveRes() {
  leaders.push({ name: playerName, score: score });
  leaders.sort((a,b) => b.score - a.score);
  leaders = leaders.slice(0, 5);
  localStorage.setItem('bb_leaders', JSON.stringify(leaders));
  alert('Сохранено!');
  backToMenu();
}

function showLeaders() {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('leaderboard').classList.remove('hidden');
  const list = document.getElementById('leaderList');
  list.innerHTML = leaders.length ? leaders.map((l,i) => `<p>${i+1}. ${l.name} - ${l.score}</p>`).join('') : '<p>Пока пусто</p>';
}

function backToMenu() {
  if(mode === 'train' && score > 0) { /* можно добавить очки в общую копилку */ }
  showMenu();
}

// --- Управление ---
canvas.addEventListener('touchstart', e => { e.preventDefault(); if(mode!=='play'||ball.flying) return; aim=true; aimX=e.touches[0].clientX; aimY=e.touches[0].clientY; });
canvas.addEventListener('touchmove', e => { e.preventDefault(); if(aim) { aimX=e.touches[0].clientX; aimY=e.touches[0].clientY; } });
canvas.addEventListener('touchend', e => { e.preventDefault(); if(!aim) return; aim=false; ball.vx=(ball.x-aimX)*0.18; ball.vy=(ball.y-aimY)*0.18; ball.flying=true; });
canvas.addEventListener('mousedown', e => { if(mode!=='play'||ball.flying) return; aim=true; aimX=e.clientX; aimY=e.clientY; });
canvas.addEventListener('mousemove', e => { if(aim) { aimX=e.clientX; aimY=e.clientY; } });
canvas.addEventListener('mouseup', e => { if(!aim) return; aim=false; ball.vx=(ball.x-aimX)*0.18; ball.vy=(ball.y-aimY)*0.18; ball.flying=true; });

// --- Цикл ---
function loop() {
  if(mode === 'play' && ball.flying) {
    ball.vy += 0.5; ball.x += ball.vx; ball.y += ball.vy;
    
    if(ball.y > canvas.height - 40 - 18) { ball.y = canvas.height - 40 - 18; ball.vy *= -0.5; ball.vx *= 0.8; }
    if(ball.x < 18) { ball.x = 18; ball.vx *= -0.8; }
    if(ball.x > canvas.width - 18) { ball.x = canvas.width - 18; ball.vx *= -0.8; }
    
    if(Math.abs(ball.x - hoop.x) < 25 && ball.y > hoop.y && ball.y < hoop.y + 20 && ball.vy > 0) {
      score++; document.getElementById('hud').textContent = 'Счёт: ' + score;
      for(let i=0; i<30; i++) confetti.push({ x: hoop.x, y: hoop.y, vx: (Math.random()-0.5)*10, vy: Math.random()*-10, life: 50, color: '#'+Math.floor(Math.random()*16777215).toString(16) });
      resetBall();
    }
    
    if(ball.x < 0 || ball.x > canvas.width || ball.y > canvas.height) resetBall();
  }
  
  // Рисование
  ctx.fillStyle = '#87CEEB'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#228B22'; ctx.fillRect(0,canvas.height-40,canvas.width,40);
  ctx.strokeStyle = '#DC143C'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(hoop.x, hoop.y, hoop.r, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = '#666'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(hoop.x+hoop.r+8, hoop.y); ctx.lineTo(hoop.x+hoop.r+8, canvas.height-40); ctx.stroke();
  
  if(aim) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    for(let t=0; t<30; t++) {
      let px = ball.x + (ball.x-aimX)*0.18*t;
      let py = ball.y + (ball.y-aimY)*0.18*t + 0.5*0.5*t*t;
      ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI*2); ctx.fill();
    }
  }
  
  ctx.fillStyle = '#FF8C00'; ctx.beginPath(); ctx.arc(ball.x, ball.y, 18, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
  
  for(let i=confetti.length-1; i>=0; i--) {
    let p = confetti[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.4; p.life--;
    if(p.life <= 0) confetti.splice(i,1);
    else { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 5, 5); }
  }
  
  requestAnimationFrame(loop);
}

// Старт
if(playerName) { document.getElementById('reg').classList.add('hidden'); showMenu(); }
loop();
</script>
</body>
</html>

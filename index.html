<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🏀 Баскетбол — играй онлайн!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: none;
    font-family: Arial, sans-serif;
    user-select: none;
  }
  canvas { display: block; touch-action: none; }
  #hud {
    position: fixed; top: 12px; left: 12px;
    font: bold 22px Arial; color: #fff;
    text-shadow: 2px 2px 0 #000;
    pointer-events: none;
  }
  #timer {
    position: fixed; top: 12px; right: 12px;
    font: bold 22px Arial; color: #fff;
    text-shadow: 2px 2px 0 #000;
    pointer-events: none;
  }
  #backBtn {
    position: fixed; bottom: 15px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
  }
  .screen {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    color: #fff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
    text-align: center;
    overflow-y: auto;
    font-family: Arial, sans-serif;
    z-index: 5;
  }
  .hidden { display: none !important; }
  h1 { font-size: 30px; margin-bottom: 15px; }
  h2 { font-size: 20px; margin: 15px 0 8px; }
  button {
    background: #ff8c00; color: #fff;
    border: none; border-radius: 10px;
    padding: 12px 24px;
    font: bold 18px Arial;
    margin: 6px;
    cursor: pointer;
    box-shadow: 0 3px 0 #b35c00;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #b35c00; }
  button.green { background: #28a745; box-shadow: 0 3px 0 #1c7a33; }
  button.gray { background: #666; box-shadow: 0 3px 0 #333; }
  button.red { background: #dc3545; box-shadow: 0 3px 0 #8a1c27; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .card {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 12px;
    padding: 10px 14px;
    margin: 4px;
    min-width: 110px;
    cursor: pointer;
    transition: 0.2s;
  }
  .card.selected { background: #ff8c00; border-color: #fff; }
  .card.locked { opacity: 0.4; cursor: not-allowed; }
  .card .name { font-weight: bold; font-size: 15px; }
  .card .info { font-size: 12px; opacity: 0.8; margin-top: 4px; }
  .score-list { font-size: 18px; line-height: 1.8; margin: 10px 0; min-width: 250px; }
  .score-list .me { color: #ffd700; font-weight: bold; }
  .score-list .row-item {
    display: flex; justify-content: space-between;
    padding: 6px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .score-list .place { width: 40px; text-align: left; }
  .score-list .name { flex: 1; text-align: left; }
  .score-list .pts { text-align: right; }
  input {
    padding: 12px; border-radius: 8px;
    border: none; font-size: 18px;
    text-align: center; width: 220px;
    margin: 10px;
  }
  .preview {
    width: 40px; height: 40px;
    border-radius: 50%;
    margin: 0 auto 6px;
    border: 2px solid #000;
  }
  .welcome-text { font-size: 16px; margin-bottom: 10px; opacity: 0.9; }
</style>
</head>
<body>
<div id="hud" class="hidden">Счёт: 0</div>
<div id="timer" class="hidden"></div>
<button id="backBtn" class="gray hidden" onclick="backToMenu()">🏠 В меню</button>
<canvas id="c"></canvas>

<!-- Экран регистрации -->
<div id="register" class="screen hidden">
  <h1>🏀 Добро пожаловать!</h1>
  <p class="welcome-text">Введи своё имя для таблицы лидеров</p>
  <input id="regName" maxlength="12" placeholder="Имя" autofocus>
  <br>
  <button class="green" onclick="doRegister()">Начать играть</button>
</div>

<!-- Стартовый экран -->
<div id="menu" class="screen hidden">
  <h1>🏀 Баскетбол</h1>
  <p class="welcome-text">Привет, <b id="helloName">Игрок</b>!</p>
  <p style="margin-bottom: 10px;">Рекорд: <b id="bestScore">0</b> очков</p>
  <button class="green" onclick="startGame('match')">⏱️ Матч (80 сек)</button>
  <button onclick="startGame('train')">🎯 Тренировка</button>
  <button class="gray" onclick="openShop()">🎨 Мячи и площадки</button>
  <button class="gray" onclick="openLeaders()">🏆 Таблица лидеров</button>
</div>

<!-- Экран окончания -->
<div id="gameover" class="screen hidden">
  <h1 id="goTitle">Игра окончена!</h1>
  <p style="font-size: 22px; margin: 10px;">Твой счёт: <b id="goScore">0</b></p>
  <p style="margin: 10px; opacity: 0.8;">Рекорд: <b id="goBest">0</b></p>
  <div id="saveScoreBlock">
    <button class="green" onclick="saveToLeaders()">💾 Сохранить в таблицу</button>
  </div>
  <button onclick="startGame(currentMode)">🔄 Ещё раз</button>
  <button class="gray" onclick="backToMenu()">🏠 В меню</button>
</div>

<!-- Магазин -->
<div id="shop" class="screen hidden">
  <h1>🎨 Мячи и площадки</h1>
  <h2>Мячи</h2>
  <div class="row" id="ballShop"></div>
  <h2>Площадки</h2>
  <div class="row" id="courtShop"></div>
  <button class="green" style="margin-top: 20px;" onclick="closeShop()">Готово</button>
</div>

<!-- Таблица лидеров -->
<div id="leaders" class="screen hidden">
  <h1>🏆 Таблица лидеров</h1>
  <div class="score-list" id="leadersList"></div>
  <button class="green" onclick="closeLeaders()">Назад</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); setHoop(); if (!ball.flying) resetBall(); });

// ---------- ПРОГРЕСС ----------
const save = {
  playerName: '',
  totalScore: 0,
  bestScore: 0,
  ball: 'basket',
  court: 'park',
  leaders: [],
  unlocked: { basket: true, football: false, beach: false }
};

function loadSave() {
  try {
    const raw = localStorage.getItem('basketball_save_v2');
    if (raw) {
      const parsed = JSON.parse(raw);
      Object.assign(save, parsed);
      if (!save.unlocked) save.unlocked = { basket: true, football: false, beach: false };
      if (!Array.isArray(save.leaders)) save.leaders = [];
    }
  } catch(e) {}
}

function writeSave() {
  try { localStorage.setItem('basketball_save_v2', JSON.stringify(save)); } catch(e) {}
}

function checkUnlock() {
  if (!save.unlocked.football && save.totalScore >= 100) {
    save.unlocked.football = true;
    setTimeout(() => alert('⚽ Открыт футбольный мяч! Загляни в магазин.'), 500);
  }
  if (!save.unlocked.beach && save.totalScore >= 165) {
    save.unlocked.beach = true;
    setTimeout(() => alert('🏐 Открыт пляжный мяч! Загляни в магазин.'), 500);
  }
  writeSave();
}

loadSave();

// ---------- МЯЧИ И ПЛОЩАДКИ ----------
const BALLS = {
  basket:   { name: 'Баскетбольный', colors: ['#FF8C00', '#000000'], require: 0 },
  football: { name: 'Футбольный',    colors: ['#FFFFFF', '#000000'], require: 100 },
  beach:    { name: 'Пляжный',       colors: ['#FFD700', '#FF4500'], require: 165 }
};

const COURTS = {
  park:    { name: 'Парк',    sky: '#87CEEB', floor: '#228B22', rim: '#DC143C' },
  stadium: { name: 'Стадион', sky: '#4A90D9', floor: '#8B4513', rim: '#FF4500' },
  night:   { name: 'Ночь',    sky: '#0B1026', floor: '#1a1a2e', rim: '#FFD700' }
};

// ---------- КОЛЬЦО И МЯЧ ----------
const hoop = { x: 0, y: 0, r: 35 };
function setHoop() {
  hoop.x = W - 90;
  hoop.y = H * 0.25;
  hoop.r = Math.min(35, W * 0.06);
}

let ball = { x: 0, y: 0, r: 18, vx: 0, vy: 0, flying: false };
function resetBall() {
  ball.x = W * 0.15;
  ball.y = H * 0.55;
  ball.r = Math.min(18, W * 0.035);
  ball.vx = 0;
  ball.vy = 0;
  ball.flying = false;
}

const gravity = 0.5;
let score = 0;
let mode = 'menu';
let currentMode = 'match';
let timeLeft = 80;
let timerInterval = null;
let confetti = [];
let scoreSaved = false;

const hudEl = document.getElementById('hud');
const timerEl = document.getElementById('timer');
const menuEl = document.getElementById('menu');
const goEl = document.getElementById('gameover');
const shopEl = document.getElementById('shop');
const leadersEl = document.getElementById('leaders');
const registerEl = document.getElementById('register');
const backBtn = document.getElementById('backBtn');

let aiming = false;
let aimStart = { x: 0, y: 0 };
let aimEnd = { x: 0, y: 0 };
let scoredThisThrow = false;

function getPos(e) {
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX, y: t.clientY };
}
function onDown(e) {
  e.preventDefault();
  if (mode !== 'play' || ball.flying) return;
  aiming = true;
  aimStart = { x: ball.x, y: ball.y };
  aimEnd = getPos(e);
}
function onMove(e) {
  e.preventDefault();
  if (!aiming) return;
  aimEnd = getPos(e);
}
function onUp(e) {
  e.preventDefault();
  if (!aiming) return;
  aiming = false;
  const dx = aimStart.x - aimEnd.x;
  const dy = aimStart.y - aimEnd.y;
  const power = 0.18;
  ball.vx = dx * power;
  ball.vy = dy * power;
  ball.flying = true;
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });
canvas.addEventListener('touchend', onUp, { passive: false });

// ---------- КОНФЕТТИ ----------
function spawnConfetti(x, y) {
  const colors = ['#FF4500', '#FFD700', '#32CD32', '#1E90FF', '#FF69B4', '#FFFFFF', '#FF8C00'];
  for (let i = 0; i < 60; i++) {
    confetti.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.7) * 12 - 2,
      size: 4 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 60 + Math.random() * 30,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.3
    });
  }
}

function updateConfetti() {
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.4; p.vx *= 0.99;
    p.rot += p.rotSpeed; p.life--;
    if (p.life <= 0 || p.y > H + 50) confetti.splice(i, 1);
  }
}

function drawConfetti() {
  for (const p of confetti) {
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
    ctx.restore();
  }
}

// ---------- РЕГИСТРАЦИЯ ----------
function showRegister() {
  registerEl.classList.remove('hidden');
  menuEl.classList.add('hidden');
}

function doRegister() {
  const name = document.getElementById('regName').value.trim();
  if (!name || name.length < 2) {
    alert('Введи имя (минимум 2 символа)');
    return;
  }
  save.playerName = name;
  writeSave();
  registerEl.classList.add('hidden');
  showMenu();
}

function showMenu() {
  mode = 'menu';
  menuEl.classList.remove('hidden');
  goEl.classList.add('hidden');
  shopEl.classList.add('hidden');
  leadersEl.classList.add('hidden');
  registerEl.classList.add('hidden');
  hudEl.classList.add('hidden');
  timerEl.classList.add('hidden');
  backBtn.classList.add('hidden');
  document.getElementById('helloName').textContent = save.playerName;
  updateBest();
}

// ---------- ИГРА ----------
function startGame(m) {
  currentMode = m;
  mode = 'play';
  score = 0;
  timeLeft = 80;
  confetti = [];
  scoreSaved = false;
  menuEl.classList.add('hidden');
  goEl.classList.add('hidden');
  shopEl.classList.add('hidden');
  leadersEl.classList.add('hidden');
  hudEl.classList.remove('hidden');
  hudEl.textContent = 'Счёт: 0';

  if (m === 'match') {
    timerEl.classList.remove('hidden');
    timerEl.textContent = '⏱️ 80';
    backBtn.classList.add('hidden');
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      timerEl.textContent = '⏱️ ' + timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);
  } else {
    // Тренировка
    timerEl.classList.add('hidden');
    clearInterval(timerInterval);
    backBtn.classList.remove('hidden');
  }

  resetBall();
  setHoop();
}

function backToMenu() {
  clearInterval(timerInterval);
  mode = 'menu';
  if (currentMode === 'train' && score > 0) {
    save.totalScore += score;
    checkUnlock();
    writeSave();
  }
  showMenu();
}

function endGame() {
  mode = 'over';
  clearInterval(timerInterval);
  hudEl.classList.add('hidden');
  timerEl.classList.add('hidden');
  backBtn.classList.add('hidden');
  goEl.classList.remove('hidden');
  document.getElementById('goScore').textContent = score;

  const isNewBest = score > save.bestScore;
  if (isNewBest) save.bestScore = score;
  document.getElementById('goBest').textContent = save.bestScore;

  scoreSaved = false;
  if (score > 0) {
    document.getElementById('saveScoreBlock').classList.remove('hidden');
  } else {
    document.getElementById('saveScoreBlock').classList.add('hidden');
  }

  // начисляем общий счёт
  save.totalScore += score;
  writeSave();
  checkUnlock();
}

function saveToLeaders() {
  if (scoreSaved) { alert('Уже сохранено!'); return; }
  save.leaders.push({ name: save.playerName, score: score, date: Date.now() });
  save.leaders.sort((a, b) => b.score - a.score);
  save.leaders = save.leaders.slice(0, 10);
  writeSave();
  scoreSaved = true;
  document.getElementById('saveScoreBlock').classList.add('hidden');
  alert('✅ Результат сохранён в таблицу лидеров!');
}

// ---------- МАГАЗИН ----------
function openShop() {
  menuEl.classList.add('hidden');
  shopEl.classList.remove('hidden');
  renderShop();
}
function closeShop() {
  shopEl.classList.add('hidden');
  menuEl.classList.remove('hidden');
  updateBest();
}
function renderShop() {
  const ballShop = document.getElementById('ballShop');
  const courtShop = document.getElementById('courtShop');
  ballShop.innerHTML = '';
  courtShop.innerHTML = '';

  for (const key in BALLS) {
    const b = BALLS[key];
    const unlocked = save.unlocked[key];
    const div = document.createElement('div');
    div.className = 'card' + (save.ball === key ? ' selected' : '') + (unlocked ? '' : ' locked');
    div.innerHTML = `
      <div class="preview" style="background:${b.colors[0]}; border-color:${b.colors[1]};"></div>
      <div class="name">${b.name}</div>
      <div class="info">${unlocked ? (save.ball === key ? '✅ Выбран' : 'Открыт') : '🔒 ' + b.require + ' очков'}</div>
    `;
    if (unlocked) div.onclick = () => { save.ball = key; writeSave(); renderShop(); };
    ballShop.appendChild(div);
  }

  for (const key in COURTS) {
    const c = COURTS[key];
    const div = document.createElement('div');
    div.className = 'card' + (save.court === key ? ' selected' : '');
    div.innerHTML = `
      <div class="preview" style="background:${c.sky}; border-radius:8px; width:50px; height:40px;"></div>
      <div class="name">${c.name}</div>
      <div class="info">${save.court === key ? '✅ Выбрано' : 'Бесплатно'}</div>
    `;
    div.onclick = () => { save.court = key; writeSave(); renderShop(); };
    courtShop.appendChild(div);
  }
}

// ---------- ТАБЛИЦА ЛИДЕРОВ ----------
function openLeaders() {
  menuEl.classList.add('hidden');
  leadersEl.classList.remove('hidden');
  const list = document.getElementById('leadersList');
  if (save.leaders.length === 0) {
    list.innerHTML = '<p>Пока пусто. Сыграй матч!</p>';
  } else {
    list.innerHTML = save.leaders.map((l, i) => {
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.';
      const me = l.name === save.playerName ? ' me' : '';
      return `<div class="row-item${me}">
        <span class="place">${medal}</span>
        <span class="name">${l.name}</span>
        <span class="pts">${l.score} очк.</span>
      </div>`;
    }).join('');
  }
}
function closeLeaders() {
  leadersEl.classList.add('hidden');
  menuEl.classList.remove('hidden');
}
function updateBest() {
  document.getElementById('bestScore').textContent = save.bestScore;
}

// ---------- ОБНОВЛЕНИЕ ----------
function update() {
  if (mode !== 'play') return;

  if (ball.flying) {
    ball.vy += gravity;
    ball.x += ball.vx;
    ball.y += ball.vy;

    const floor = H - 40;
    if (ball.y > floor - ball.r) {
      ball.y = floor - ball.r;
      ball.vy *= -0.55;
      ball.vx *= 0.8;
    }
    if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -0.7; }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx *= -0.7; }

    const dxh = ball.x - hoop.x;
    const dyh = ball.y - hoop.y;
    if (!scoredThisThrow && Math.abs(dxh) < hoop.r * 0.8 && dyh > -5 && dyh < 25 && ball.vy > 0) {
      score++;
      hudEl.textContent = 'Счёт: ' + score;
      spawnConfetti(hoop.x, hoop.y);
      scoredThisThrow = true;
    }

    if (Math.abs(ball.vx) < 0.3 && Math.abs(ball.vy) < 0.3 &&
        ball.y >= floor - ball.r - 1) {
      resetBall();
      scoredThisThrow = false;
    }
  }

  updateConfetti();
}

// ---------- РИСОВАНИЕ ----------
function drawBackground(court) {
  if (court === 'night') {
    ctx.fillStyle = COURTS.night.sky;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#FFF';
    for (let i = 0; i < 50; i++) {
      const sx = (i * 137) % W;
      const sy = (i * 79) % (H * 0.7);
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.fillStyle = '#FFFACD';
    ctx.beginPath();
    ctx.arc(W * 0.15, H * 0.15, 30, 0, Math.PI * 2);
    ctx.fill();
  } else if (court === 'stadium') {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#3A70B5');
    g.addColorStop(1, '#87CEEB');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#555';
    ctx.fillRect(0, H * 0.6, W, H * 0.1);
    for (let i = 0; i < 60; i++) {
      ctx.fillStyle = ['#FF4500','#FFD700','#32CD32','#1E90FF'][i % 4];
      ctx.fillRect((i * 23) % W, H * 0.6 + 8 + (i % 3) * 8, 6, 6);
    }
  } else {
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(W * 0.85, H * 0.12, 35, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < 5; i++) {
      const tx = (i + 1) * (W / 6);
      ctx.fillStyle = '#2E8B57';
      ctx.beginPath();
      ctx.arc(tx, H * 0.55, 25, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#8B4513';
      ctx.fillRect(tx - 5, H * 0.55, 10, H * 0.1);
    }
  }
}

function drawBall() {
  const colors = BALLS[save.ball].colors;
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.beginPath();
  ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = colors[0];
  ctx.fill();
  ctx.strokeStyle = colors[1];
  ctx.lineWidth = 2;
  ctx.stroke();

  if (save.ball === 'basket') {
    ctx.beginPath();
    ctx.moveTo(-ball.r, 0); ctx.lineTo(ball.r, 0);
    ctx.moveTo(0, -ball.r); ctx.lineTo(0, ball.r);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, ball.r * 0.6, 0, Math.PI * 2);
    ctx.stroke();
  } else if (save.ball === 'football') {
    ctx.beginPath();
    ctx.arc(0, 0, ball.r * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = colors[1];
    ctx.fill();
    for (let i = 0; i < 5; i++) {
      const a = i * (Math.PI * 2 / 5) - Math.PI / 2;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * ball.r * 0.75, Math.sin(a) * ball.r * 0.75, ball.r * 0.22, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (save.ball === 'beach') {
    for (let i = 0; i < 6; i++) {
      const a = i * (Math.PI / 3);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, ball.r, a, a + Math.PI / 6);
      ctx.closePath();
      ctx.fillStyle = i % 2 === 0 ? colors[0] : colors[1];
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
    ctx.strokeStyle = colors[1];
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
}

function draw() {
